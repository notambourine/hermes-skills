name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck (*.sh, *.bash)
        run: |
          files=$(git ls-files '*.sh' '*.bash')
          if [ -z "$files" ]; then
            echo "no shell files to lint"; exit 0
          fi
          echo "$files" | xargs shellcheck

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ruff check (*.py)
        # Pinned for reproducibility; bump deliberately. pipx is preinstalled on the runner.
        run: pipx run --spec ruff==0.15.18 ruff check .
